run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
  goconst:
    min-occurrences: 4
  misspell:
    locale: UK
  revive:
    rules:
      - name: exported
        disabled: true
  gocritic:
    disabled-checks:
      - ifElseChain

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - goconst
    - path: internal/fiscal/mock/
      linters:
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0

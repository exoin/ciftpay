name: ciftpay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ciftpay"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: api
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://ciftpay:ciftpay@postgres:5432/ciftpay?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      MASTER_KEY_B64: ${MASTER_KEY_B64:-ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtZm9yLWRldiE=}
      DARAJA_ENV: ${DARAJA_ENV:-sandbox}
      DARAJA_BASE_URL: ${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-600000}
      DARAJA_WEBHOOK_TOKEN: ${DARAJA_WEBHOOK_TOKEN:-dev-webhook-token}
      UPLOAD_DIR: /var/lib/ciftpay/uploads
      FISCAL_ADAPTER: ${FISCAL_ADAPTER:-oscu}
      KRA_OSCU_ENV: ${KRA_OSCU_ENV:-sandbox}
      KRA_OSCU_BASE_URL: ${KRA_OSCU_BASE_URL:-https://sbx.kra.go.ke}
      KRA_OSCU_API_BASE_URL: ${KRA_OSCU_API_BASE_URL:-https://etims-api-sbx.kra.go.ke}
      KRA_OSCU_CONSUMER_KEY: ${KRA_OSCU_CONSUMER_KEY:-}
      KRA_OSCU_CONSUMER_SECRET: ${KRA_OSCU_CONSUMER_SECRET:-}
      KRA_OSCU_DEVICE_SERIAL: ${KRA_OSCU_DEVICE_SERIAL:-}
      KRA_OSCU_DNS_RESOLVER: ${KRA_OSCU_DNS_RESOLVER:-8.8.8.8:53}
      AT_BASE_URL: http://sms-sink:8025
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-dev-at-key}
      AT_SENDER_ID: ${AT_SENDER_ID:-CIFTPAY}
    volumes:
      - uploads:/var/lib/ciftpay/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://ciftpay:ciftpay@postgres:5432/ciftpay?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:8080}
      MASTER_KEY_B64: ${MASTER_KEY_B64:-ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtZm9yLWRldiE=}
      FISCAL_ADAPTER: ${FISCAL_ADAPTER:-oscu}
      KRA_OSCU_ENV: ${KRA_OSCU_ENV:-sandbox}
      KRA_OSCU_BASE_URL: ${KRA_OSCU_BASE_URL:-https://sbx.kra.go.ke}
      KRA_OSCU_API_BASE_URL: ${KRA_OSCU_API_BASE_URL:-https://etims-api-sbx.kra.go.ke}
      KRA_OSCU_CONSUMER_KEY: ${KRA_OSCU_CONSUMER_KEY:-}
      KRA_OSCU_CONSUMER_SECRET: ${KRA_OSCU_CONSUMER_SECRET:-}
      KRA_OSCU_DEVICE_SERIAL: ${KRA_OSCU_DEVICE_SERIAL:-}
      KRA_OSCU_DNS_RESOLVER: ${KRA_OSCU_DNS_RESOLVER:-8.8.8.8:53}
      MOCK_FAIL_MODE: ${MOCK_FAIL_MODE:-none}
      AT_BASE_URL: http://sms-sink:8025
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-dev-at-key}
      AT_SENDER_ID: ${AT_SENDER_ID:-CIFTPAY}
    depends_on:
      postgres:
        condition: service_healthy

  sms-sink:
    build:
      context: ./backend
      target: smssink
    ports:
      - "8025:8025"

  web:
    build:
      # Root context so the image can regenerate the TS client from api/openapi.yaml.
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3000
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  # Signed Safaricom authorization letters (ADR-0008); never served publicly.
  uploads:

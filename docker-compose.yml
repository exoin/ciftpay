name: ciftpay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ciftpay"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: api
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://ciftpay:ciftpay@postgres:5432/ciftpay?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      MASTER_KEY_B64: ${MASTER_KEY_B64:-ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtZm9yLWRldiE=}
      DARAJA_WEBHOOK_TOKEN: ${DARAJA_WEBHOOK_TOKEN:-dev-webhook-token}
      FISCAL_ADAPTER: ${FISCAL_ADAPTER:-mock}
      AT_BASE_URL: http://sms-sink:8025
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-dev-at-key}
      AT_SENDER_ID: ${AT_SENDER_ID:-CIFTPAY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://ciftpay:ciftpay@postgres:5432/ciftpay?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      MASTER_KEY_B64: ${MASTER_KEY_B64:-ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtZm9yLWRldiE=}
      FISCAL_ADAPTER: ${FISCAL_ADAPTER:-mock}
      MOCK_FAIL_MODE: ${MOCK_FAIL_MODE:-none}
      AT_BASE_URL: http://sms-sink:8025
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-dev-at-key}
      AT_SENDER_ID: ${AT_SENDER_ID:-CIFTPAY}
    depends_on:
      postgres:
        condition: service_healthy

  sms-sink:
    build:
      context: ./backend
      target: smssink
    ports:
      - "8025:8025"

  web:
    build:
      context: ./web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:

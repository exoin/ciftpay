<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CiftPay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1320;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #10b981;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="logo">CiftPay</div>
  <div class="tagline">Connecting to CiftPay Core...</div>
  <script>
    // In mobile app context, redirect immediately to the configured server or default gateway
    (function() {
      var serverUrl = window.localStorage.getItem('ciftpay.server_url') || 'http://10.0.2.2:3000';
      // If we are already running on a remote origin, do nothing
      if (window.location.protocol.indexOf('http') === 0 && window.location.hostname !== 'localhost') {
        return;
      }
      setTimeout(function() {
        window.location.href = serverUrl;
      }, 500);
    })();
  </script>
</body>
</html>

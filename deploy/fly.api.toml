# Placeholder Fly.io configuration for the api binary.
# fly deploy -c deploy/fly.api.toml
# Secrets are set with `fly secrets set` and never stored in this file.

app = "ciftpay-api"
primary_region = "jnb"

[build]
  dockerfile = "../backend/Dockerfile"
  build-target = "api"

[env]
  APP_ENV = "production"
  HTTP_ADDR = ":8080"
  PUBLIC_BASE_URL = "https://api.ciftpay.co.ke"
  FISCAL_ADAPTER = "vendor"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Placeholder Fly.io configuration for the Next.js PWA.
# fly deploy -c deploy/fly.web.toml

app = "ciftpay-web"
primary_region = "jnb"

[build]
  dockerfile = "../web/Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_PUBLIC_API_BASE_URL = "https://api.ciftpay.co.ke"
  API_BASE_URL = "http://ciftpay-api.internal:8080"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
